name: Testing Python Package

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 0"

permissions:
  contents: read

jobs:
  test:

    name: Run tests

    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:

      # See: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # setuptools-scm derives the version from the tags, so fetch them all
          fetch-depth: 0

      # See: https://github.com/actions/setup-python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # See: https://github.com/actions/cache
      - name: Cache wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          pytest --verbose --color=yes

      - name: Run linter with pylint
        run: |
          pylint shirokumas

      - name: Run linter with ruff
        run: |
          ruff check .

      - name: Run formatter with ruff
        run: |
          ruff format --check --diff .

      - name: Run type checker with mypy
        run: |
          mypy shirokumas

