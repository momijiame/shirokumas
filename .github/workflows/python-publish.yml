name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:

  deploy:

    runs-on: ubuntu-latest

    # Gated by a wait timer and restricted to v* tags; also the environment
    # PyPI's trusted publisher is registered against.
    environment: pypi

    permissions:
      # Mint the OIDC token that PyPI exchanges for a short-lived upload
      # token. Without this the publish step has no credential at all.
      id-token: write
      contents: read

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:

      # See: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # setuptools-scm derives the version from the tags, so fetch them all
          fetch-depth: 0

      # See: https://github.com/actions/setup-python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # See: https://github.com/pypa/gh-action-pypi-publish
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # No user/password: the action detects the OIDC token and exchanges
          # it with PyPI itself. PEP 740 attestations are on by default and
          # only work over trusted publishing.
          print-hash: true

